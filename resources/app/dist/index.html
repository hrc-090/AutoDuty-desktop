<!DOCTYPE html>
<html lang="zh-CN" class="theme-light">
<head>
    <meta charset="UTF-8">
    <title>AutoDuty 值日提醒</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      // 首次绘制前按系统深浅色设置主题类，避免白屏/闪色。
      // prefers-color-scheme 跟随主进程 nativeTheme.themeSource（theme 配置），
      // 后续由 src/autoduty/theme.js 接管（含系统模式监听与手动覆盖）。
      (function () {
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var el = document.documentElement;
        el.classList.toggle('theme-dark', dark);
        el.classList.toggle('theme-light', !dark);
      })();
    </script>
  <script type="module" crossorigin src="./assets/index-DBQVelPj.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CkRfczfo.css">
</head>
<body>
    <div id="app"></div>
</body>
</html>
